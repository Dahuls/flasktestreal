#@ if cloud66.service.routes:
#@ for route in dict(cloud66.service.routes).values():
#@ if route.kind == "IngressRouteTCP":
--- # keep
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  annotations:
    cloud66.com/service: service-118bcb3ad7f1d293cb04add6994e4bc2 # important, keep this
  name: #@ route.name
  namespace: #@ cloud66.app.namespace
spec:
  entryPoints:
    - #@ route.entrypoint
  routes:
    - match: #@ "Host(`%s`)" % route.host
      services:
        - name: #@ route.targetService
          port: #@ route.targetPort
      #@ if/end route.tcpMiddlewares:
      middlewares:
        #@ for/end tcpMiddleware in route.tcpMiddlewares:
        - name: #@ tcpMiddleware.name
  #@ if/end route.tls:
  tls:
    secretName: #@ route.tls.secretName
#@ end
#@ end
#@ end

apiVersion: apps/v1
kind: Deployment
metadata:
  name: percona-pxc-operator
  namespace: c66-cluster-pxc
  labels:
    app.kubernetes.io/name: pxc-operator
    app.kubernetes.io/instance: percona
    app.kubernetes.io/version: 1.19.0
  annotations:
    cloud66.com/operator: operator-b58813e360581e222938f1007e8b1d18 # important, keep this
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: operator
      app.kubernetes.io/name: pxc-operator
      app.kubernetes.io/instance: percona
      app.kubernetes.io/part-of: pxc-operator
  strategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: operator
        app.kubernetes.io/name: pxc-operator
        app.kubernetes.io/instance: percona
        app.kubernetes.io/part-of: pxc-operator
      annotations:
        cloud66.com/operator: operator-b58813e360581e222938f1007e8b1d18 # important, keep this
    spec:
      serviceAccountName: percona-pxc-operator
      terminationGracePeriodSeconds: 600
      containers:
      - name: percona-xtradb-cluster-operator
        image: us-east4-docker.pkg.dev/production-911/docker-public/csv3-percona-xtradb-cluster-operator:1.19.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: metrics
          protocol: TCP
        command:
        - percona-xtradb-cluster-operator
        env:
        - name: WATCH_NAMESPACE
          value: ''
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: OPERATOR_NAME
          value: percona-pxc-operator
        - name: LOG_STRUCTURED
          value: 'false'
        - name: LOG_LEVEL
          value: INFO
        - name: DISABLE_TELEMETRY
          value: 'true'
        - name: MAX_CONCURRENT_RECONCILES
          value: '1'
        - name: S3_WORKERS_LIMIT
          value: '10'
        - name: PXCO_FEATURE_GATES
          value: XtrabackupSidecar=false
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: "/metrics"
            port: metrics
            scheme: HTTP
        resources:
          limits:
            cpu: 200m
            memory: 500Mi
          requests:
            cpu: 100m
            memory: 20Mi

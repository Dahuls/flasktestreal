apiVersion: apps/v1
kind: Deployment
metadata:
  name: digitalocean-cloud-controller-manager-admission-server
  namespace: c66-cluster-digitalocean-ccm
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: digitalocean-cloud-controller-manager-admission-server
  template:
    metadata:
      labels:
        app: digitalocean-cloud-controller-manager-admission-server
    spec:
      containers:
      - image: digitalocean/digitalocean-cloud-controller-manager-admission-server:v0.1.64
        name: digitalocean-cloud-controller-manager-admission-server
        command:
        - "/bin/digitalocean-cloud-controller-manager-admission-server"
        resources:
          requests:
            cpu: 100m
            memory: 50Mi
        env:
        - name: DO_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: digitalocean
              key: access-token
        ports:
        - containerPort: 9443
          name: admission
          protocol: TCP
        volumeMounts:
        - mountPath: "/tmp/k8s-webhook-server/serving-certs"
          name: serving-certs
          readOnly: true
      volumes:
      - name: serving-certs
        secret:
          defaultMode: 420
          secretName: digitalocean-cloud-controller-manager-admission-server-serving-certs

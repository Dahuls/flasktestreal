#@ if cloud66.service.routes:
#@ for route in dict(cloud66.service.routes).values():
#@ if route.kind == "IngressRoute":
--- # keep
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  annotations:
    cloud66.com/service: service-39e6d45232d7a2e6573d3ac0623fbe00 # important, keep this
  name: #@ route.name
  namespace: #@ cloud66.app.namespace
spec:
  entryPoints:
    - #@ route.entrypoint
  routes:
    - kind: Rule
      match: #@ "Host(`%s`)" % route.host
      services:
        - name: #@ route.targetService
          port: #@ route.targetPort
      #@ if/end route.middlewares:
      middlewares:
        #@ for/end middleware in route.middlewares:
        - name: #@ middleware.name
  #@ if/end route.tls:
  tls:
    secretName: #@ route.tls.secretName
#@ end
#@ end
#@ end

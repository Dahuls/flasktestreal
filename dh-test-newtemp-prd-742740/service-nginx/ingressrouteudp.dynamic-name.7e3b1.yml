#@ if cloud66.service.routes:
#@ for route in dict(cloud66.service.routes).values():
#@ if route.kind == "IngressRouteUDP":
--- # keep
apiVersion: traefik.io/v1alpha1
kind: IngressRouteUDP
metadata:
  annotations:
    cloud66.com/service: service-e3c8eee2a3d112b09ffe327f4eabd93f # important, keep this
  name: #@ route.name
  namespace: #@ cloud66.app.namespace
spec:
  entryPoints:
    - #@ route.entrypoint
  routes:
    - services:
      - name: #@ route.targetService
        port: #@ route.targetPort
#@ end
#@ end
#@ end

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-issuer-ingress
spec:
  acme:
    email: #@ cloud66.cluster.letsEncrypt.accountEmail
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-issuer-ingress
    solvers:
    - http01:
        ingress:
          ingressClassName: traefik

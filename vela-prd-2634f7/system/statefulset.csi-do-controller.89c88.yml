kind: StatefulSet
apiVersion: apps/v1
metadata:
  name: csi-do-controller
  namespace: c66-cluster-digitalocean-csi
spec:
  serviceName: csi-do
  selector:
    matchLabels:
      app: csi-do-controller
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: csi-do-plugin
      labels:
        app: csi-do-controller
        role: csi-do
    spec:
      priorityClassName: system-cluster-critical
      serviceAccount: csi-do-controller-sa
      containers:
      - name: csi-provisioner
        image: registry.k8s.io/sig-storage/csi-provisioner:v6.0.0
        args:
        - "--csi-address=$(ADDRESS)"
        - "--default-fstype=ext4"
        - "--v=5"
        env:
        - name: ADDRESS
          value: "/var/lib/csi/sockets/pluginproxy/csi.sock"
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - name: socket-dir
          mountPath: "/var/lib/csi/sockets/pluginproxy/"
      - name: csi-attacher
        image: registry.k8s.io/sig-storage/csi-attacher:v4.10.0
        args:
        - "--csi-address=$(ADDRESS)"
        - "--v=5"
        - "--reconcile-sync=30m"
        - "--timeout=2m"
        env:
        - name: ADDRESS
          value: "/var/lib/csi/sockets/pluginproxy/csi.sock"
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - name: socket-dir
          mountPath: "/var/lib/csi/sockets/pluginproxy/"
      - name: csi-snapshotter
        image: registry.k8s.io/sig-storage/csi-snapshotter:v8.4.0
        args:
        - "--csi-address=$(ADDRESS)"
        - "--v=5"
        env:
        - name: ADDRESS
          value: "/var/lib/csi/sockets/pluginproxy/csi.sock"
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - name: socket-dir
          mountPath: "/var/lib/csi/sockets/pluginproxy/"
      - name: csi-resizer
        image: registry.k8s.io/sig-storage/csi-resizer:v2.0.0
        args:
        - "--csi-address=$(ADDRESS)"
        - "--timeout=30s"
        - "--v=5"
        - "--handle-volume-inuse-error=false"
        env:
        - name: ADDRESS
          value: "/var/lib/csi/sockets/pluginproxy/csi.sock"
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - name: socket-dir
          mountPath: "/var/lib/csi/sockets/pluginproxy/"
      - name: csi-do-plugin
        image: digitalocean/do-csi-plugin:v4.15.0
        args:
        - "--endpoint=$(CSI_ENDPOINT)"
        - "--token=$(DIGITALOCEAN_ACCESS_TOKEN)"
        - "--url=$(DIGITALOCEAN_API_URL)"
        - "--default-volumes-page-size=200"
        env:
        - name: CSI_ENDPOINT
          value: unix:///var/lib/csi/sockets/pluginproxy/csi.sock
        - name: DIGITALOCEAN_API_URL
          value: https://api.digitalocean.com/
        - name: DIGITALOCEAN_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: digitalocean
              key: access-token
        imagePullPolicy: Always
        volumeMounts:
        - name: socket-dir
          mountPath: "/var/lib/csi/sockets/pluginproxy/"
      volumes:
      - name: socket-dir
        emptyDir: {}
